<!DOCTYPE html>
<html lang="mr"><head><meta charset="utf-8"><title>Keyboard test - Sanjeevani</title>
<style>
body{background:#0b1220;color:#e2e8f0;font-family:'Nirmala UI','Segoe UI',sans-serif;margin:24px}
h2{margin:0 0 4px} p{color:#94a3b8;margin:0 0 18px}
.row{display:flex;gap:6px;margin-bottom:6px}
.k{height:44px;min-width:44px;border:1px solid #334155;border-radius:7px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px;box-sizing:border-box;transition:background .1s}
.k.on{background:#0f766e;border-color:#2dd4bf}
.k.now{background:#2dd4bf;color:#042f2e}
#last{margin-top:16px;color:#5eead4;font-size:18px} button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:6px 14px;cursor:pointer}
</style></head><body>
<h2>Keyboard test</h2>
<p>प्रत्येक key दाबा. चालणारी key हिरवी होते. न होणारी key = खराब / अडकलेली. (Fn, काही media keys browser ला दिसत नाहीत.)</p>
<div id="kb"></div>
<div id="last">शेवटची key: -</div>
<p style="margin-top:12px"><button onclick="reset()">Reset</button> <span id="count"></span></p>
<script>
var L=[
[['Escape','Esc',1],['F1','F1'],['F2','F2'],['F3','F3'],['F4','F4'],['F5','F5'],['F6','F6'],['F7','F7'],['F8','F8'],['F9','F9'],['F10','F10'],['F11','F11'],['F12','F12'],['PrintScreen','PrtSc'],['Delete','Del']],
[['Backquote','`'],['Digit1','1'],['Digit2','2'],['Digit3','3'],['Digit4','4'],['Digit5','5'],['Digit6','6'],['Digit7','7'],['Digit8','8'],['Digit9','9'],['Digit0','0'],['Minus','-'],['Equal','='],['Backspace','Backspace',2.2]],
[['Tab','Tab',1.5],['KeyQ','Q'],['KeyW','W'],['KeyE','E'],['KeyR','R'],['KeyT','T'],['KeyY','Y'],['KeyU','U'],['KeyI','I'],['KeyO','O'],['KeyP','P'],['BracketLeft','['],['BracketRight',']'],['Backslash','\\',1.6]],
[['CapsLock','Caps',1.8],['KeyA','A'],['KeyS','S'],['KeyD','D'],['KeyF','F'],['KeyG','G'],['KeyH','H'],['KeyJ','J'],['KeyK','K'],['KeyL','L'],['Semicolon',';'],['Quote',"'"],['Enter','Enter',2.4]],
[['ShiftLeft','Shift',2.3],['KeyZ','Z'],['KeyX','X'],['KeyC','C'],['KeyV','V'],['KeyB','B'],['KeyN','N'],['KeyM','M'],['Comma',','],['Period','.'],['Slash','/'],['ShiftRight','Shift',2.9]],
[['ControlLeft','Ctrl',1.4],['MetaLeft','Win',1.2],['AltLeft','Alt',1.2],['Space','Space',6.5],['AltRight','Alt',1.2],['ContextMenu','Menu',1.2],['ControlRight','Ctrl',1.4],['ArrowLeft','←'],['ArrowUp','↑'],['ArrowDown','↓'],['ArrowRight','→']],
[['Home','Home'],['End','End'],['PageUp','PgUp'],['PageDown','PgDn'],['Insert','Ins'],['NumLock','Num'],['Numpad0','N0'],['Numpad1','N1'],['Numpad2','N2'],['Numpad3','N3'],['Numpad4','N4'],['Numpad5','N5'],['Numpad6','N6'],['Numpad7','N7'],['Numpad8','N8'],['Numpad9','N9'],['NumpadEnter','N⏎']]
];
var kb=document.getElementById('kb'),el={},total=0;
L.forEach(function(r){var d=document.createElement('div');d.className='row';r.forEach(function(k){var e=document.createElement('div');e.className='k';e.textContent=k[1];e.style.minWidth=(44*(k[2]||1))+'px';el[k[0]]=e;d.appendChild(e);total++});kb.appendChild(d)});
function cnt(){document.getElementById('count').textContent=document.querySelectorAll('.k.on').length+' / '+total+' keys OK'}
document.addEventListener('keydown',function(e){e.preventDefault();var k=el[e.code];if(k){k.classList.add('on','now')}document.getElementById('last').textContent='शेवटची key: '+e.code+' ('+e.key+')';cnt()});
document.addEventListener('keyup',function(e){e.preventDefault();var k=el[e.code];if(k)k.classList.remove('now');if(e.code==='PrintScreen'&&k)k.classList.add('on');cnt()});
function reset(){Object.keys(el).forEach(function(c){el[c].classList.remove('on','now')});cnt()}
cnt();
</script></body></html>
