name: UI screenshots

# Renders every PC Doctor page in English, Marathi and Hindi (real scan of the runner) to PNG files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kit/Sanjeevani/PCDoctor/**'
      - '.github/workflows/ui.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Render pages
        shell: powershell
        run: |
          $ps1 = 'kit\Sanjeevani\PCDoctor\PCDoctor.ps1'
          $bad = 0
          foreach ($l in 'en', 'mr', 'hi') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File $ps1 -Screenshot "$PWD\shots" -Lang $l
            if ($LASTEXITCODE) { $bad++ }
          }
          Get-ChildItem shots | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if ($bad) { exit 1 }
      - name: Publish to the ui-shots branch (viewable without downloading artifacts)
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ui-shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "PC Doctor screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcdoctor-screenshots
          path: shots
